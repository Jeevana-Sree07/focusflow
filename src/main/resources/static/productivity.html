<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity - FocusFlow</title>

<link rel="stylesheet" href="productivity.css">
</head>

<body>

<div class="page">

    <header>
        <h1>FocusFlow</h1>
        <a href="index.html">← Back</a>
    </header>

    <main>

        <h2 class="page-title">Productivity</h2>

        <div class="stats">

            <div class="stat-box">
                <h3>Today's Progress</h3>
                <p>✔ Completed : <strong>2 / 4 Tasks</strong></p>
            </div>

            <div class="stat-box">
                <h3>Focus Time</h3>
                <p>🍅 2h 15m</p>
            </div>

            <div class="stat-box">
                <h3>Productivity Score</h3>
                <p class="score">82%</p>
            </div>

            <div class="stat-box">
                <h3>Motivation</h3>
                <p>"Small progress every day leads to big success."</p>
            </div>

        </div>

        <div class="buttons">

            <button>Refresh</button>

            <button onclick="window.location.href='index.html'">
                Back
            </button>

        </div>

    </main>

    <footer>
        © FocusFlow
    </footer>

</div>

</body>
</html>
