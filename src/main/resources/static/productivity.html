<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity — FocusFlow</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<header>
  <h1>FocusFlow</h1>
  <a class="back-link" href="index.html">← Back</a>
</header>

<main class="detail">
  <h2>Productivity</h2>
  <p class="sub">Your Progress This Week</p>
  <hr>
  <div class="stat-row">
    <div class="stat-box"><span class="stat-num" id="stat-completed">0</span><span class="stat-label">Tasks Completed</span></div>
    <div class="stat-box"><span class="stat-num" id="stat-focus">0</span><span class="stat-label">Focus Sessions</span></div>
    <div class="stat-box"><span class="stat-num" id="stat-streak">0</span><span class="stat-label">Day Streak</span></div>
  </div>
  <div class="bars" id="bars"></div>
  <hr>
  <div class="action-row">
    <a href="index.html"><button type="button">Back</button></a>
  </div>
</main>

<footer>© FocusFlow</footer>

<script src="index.js"></script>
</body>
</html>
