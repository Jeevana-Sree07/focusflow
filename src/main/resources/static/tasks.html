<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Tasks - FocusFlow</title>
    <link rel="stylesheet" href="tasks.css">
</head>

<body>

<div class="task-container">

    <!-- Header -->
    <header>
        <h1>FocusFlow</h1>
        <a href="index.html" class="back-link">← Back</a>
    </header>

    <!-- Main Content -->
    <main class="task-content">

        <h2 class="task-title">Today's Tasks</h2>

        <div class="add-task">
            + Add New Task
        </div>

        <ul class="task-list">

            <li>
                <label>
                    <input type="checkbox">
                    Java Assignment
                </label>
            </li>

            <li>
                <label>
                    <input type="checkbox" checked>
                    DSA Practice
                </label>
            </li>

            <li>
                <label>
                    <input type="checkbox">
                    Mini Project
                </label>
            </li>

            <li>
                <label>
                    <input type="checkbox" checked>
                    Aptitude Practice
                </label>
            </li>

        </ul>

        <div class="buttons">

            <button type="button">Add</button>

            <button type="button">Edit</button>

            <button type="button">Delete</button>

            <a href="index.html">
                <button type="button">Back</button>
            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        © FocusFlow
    </footer>

</div>

</body>
</html>
